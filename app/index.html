<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.json" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <title>Badou</title>
    <style>
      @media (min-width: 650px) and (min-height: 1000px) {
        .col-form-label,
        .form-control,
        .btn {
          font-size: 1.7rem;
        }
        .mb-3 {
          margin-bottom: 1.25rem !important;
        }
      }
      .form-control {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid" style="max-width: 600px; min-width: 400px">
      <div style="height: 100vh">
        <form onsubmit="return false;" class="row m-3">
          <div>
            <div class="row mb-3">
              <label for="product-1" class="col-form-label col-7">
                Softs
              </label>
              <div class="col-5">
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="product-1"
                />
              </div>
            </div>

            <div class="row mb-3">
              <label for="product-2" class="col-form-label col-7">
                Eau plate
              </label>
              <div class="col-5">
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="product-2"
                />
              </div>
            </div>

            <div class="row mb-3">
              <label for="product-3" class="col-form-label col-7">
                Pils / Blanche / Placebo
              </label>
              <div class="col-5">
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="product-3"
                />
              </div>
            </div>

            <div class="row mb-3">
              <label for="product-4" class="col-form-label col-7">
                Hopera / Fructus
              </label>
              <div class="col-5">
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="product-4"
                />
              </div>
            </div>

            <div class="row mb-3">
              <label for="product-5" class="col-form-label col-7">
                Maitrank
              </label>
              <div class="col-5">
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="product-5"
                />
              </div>
            </div>

            <hr />

            <div class="row mb-3">
              <label for="jug-1" class="col-form-label col-7">
                Cruche Pils / Blanche
              </label>
              <div class="col-5">
                <input type="number" min="0" class="form-control" id="jug-1" />
              </div>
            </div>

            <div class="row mb-3">
              <label for="jug-2" class="col-form-label col-7">
                Cruche Hopera / Fructus
              </label>
              <div class="col-5">
                <input type="number" min="0" class="form-control" id="jug-2" />
              </div>
            </div>

            <div class="row mb-3">
              <label for="jug-3" class="col-form-label col-7">
                Demi cruche Maitrank
              </label>
              <div class="col-5">
                <input type="number" min="0" class="form-control" id="jug-3" />
              </div>
            </div>

            <div class="row mb-3">
              <label for="jug-4" class="col-form-label col-7">
                Cruche Maitrank
              </label>
              <div class="col-5">
                <input type="number" min="0" class="form-control" id="jug-4" />
              </div>
            </div>

            <hr />

            <div class="row mb-3">
              <label for="return-1" class="col-form-label col-7">
                Gobelets rendus
              </label>
              <div class="col-5">
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="return-1"
                />
              </div>
            </div>

            <div class="row mb-3">
              <label for="return-2" class="col-form-label col-7">
                Cruches rendues
              </label>
              <div class="col-5">
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="return-2"
                />
              </div>
            </div>

            <div class="row mb-3">
              <label for="return-3" class="col-form-label col-7">
                Gobelets supp.
              </label>
              <div class="col-5">
                <input
                  type="number"
                  min="0"
                  class="form-control"
                  id="return-3"
                />
              </div>
            </div>

            <hr />

            <div class="row fw-bold">
              <label class="col-8 fs-3 text-end">Total</label>
              <p class="col-4 fs-3 text-end"><span id="total">0</span>€</p>
            </div>
          </div>
          <div class="d-grid">
            <button id="reset" type="reset" class="btn btn-secondary">
              Reset
            </button>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="app.js?version=1.0.0"></script>
  </body>
</html>
